name: Keep MCP server alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping MCP server
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://fxgl-skills-mcp.onrender.com/health)
          echo "Health check status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::MCP server returned $STATUS — may be starting up"
          fi
